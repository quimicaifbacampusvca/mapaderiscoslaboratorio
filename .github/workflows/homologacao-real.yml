name: Homologação real MRL (H01-H10)

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/homologacao-real.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/homologacao-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegador-real:
    name: ${{ matrix.destino }} / Chromium, Firefox e WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        destino: [local, publicado]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Instalar motores de navegador
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Iniciar servidor da cópia do branch
        if: matrix.destino == 'local'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mrl-http.log 2>&1 &
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mrl-http.log
          exit 1
      - name: Conferir publicação HTTPS e versão do cache PWA
        if: matrix.destino == 'publicado'
        run: |
          set -euo pipefail
          SITE='https://quimicaifbacampusvca.github.io/mapaderiscoslaboratorio/'
          curl -fsSL --retry 3 "$SITE" -o /tmp/mrl-site.html
          curl -fsSL --retry 3 "${SITE}sw.js" -o /tmp/mrl-site-sw.js
          grep -q 'Mapa de Riscos' /tmp/mrl-site.html
          grep -q 'CACHE_NAME' /tmp/mrl-site-sw.js
          echo "GitHub Pages verificado: $SITE"
          grep 'const CACHE_NAME' /tmp/mrl-site-sw.js
      - name: Executar H01-H10, acessibilidade complementar e PWA
        run: npx playwright test --config=tests/playwright.homologacao.config.mjs
        env:
          CI: 'true'
          MRL_URL: ${{ matrix.destino == 'publicado' && 'https://quimicaifbacampusvca.github.io/mapaderiscoslaboratorio/' || 'http://127.0.0.1:4173/' }}
      - name: Guardar relatórios, capturas, vídeos e traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-${{ matrix.destino }}-${{ github.run_id }}
          path: tests/qa-results/
          retention-days: 30
          if-no-files-found: warn
