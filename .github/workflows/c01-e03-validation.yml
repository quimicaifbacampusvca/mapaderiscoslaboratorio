name: C01 E03 - qualidade do editor

on:
  push:
    branches:
      - main
      - 'fix/c01-e03-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes-estaticos-e-regressoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe JavaScript
        run: |
          set -euo pipefail
          for file in js/*.js tests/*.mjs; do
            node --check "$file"
          done
      - name: Executar regressões do editor
        run: |
          set -euo pipefail
          for file in \
            tests/core-smoke.mjs \
            tests/frontend-integrity-smoke.mjs \
            tests/no-login-smoke.mjs \
            tests/ui-bindings-smoke.mjs \
            tests/uiux-*.mjs \
            tests/c01-e03-inventario-restricoes.mjs; do
            echo "Executando $file"
            node "$file"
          done
