name: Homologação real MRL (H01-H10)

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/homologacao-real.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/homologacao-real.yml'
  workflow_dispatch:
    inputs:
      destino:
        description: 'Aplicação a testar (publicado usa GitHub Pages real)'
        type: choice
        options: [local, publicado]
        default: local
        required: true

permissions:
  contents: read

jobs:
  navegador-real:
    name: Chromium / Firefox / WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Instalar motores de navegador
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Iniciar servidor da cópia do branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mrl-http.log 2>&1 &
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mrl-http.log
          exit 1
      - name: Executar cenários H01-H10 e amostragem de viewports
        run: npx playwright test --config=tests/playwright.homologacao.config.mjs
        env:
          CI: 'true'
          MRL_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.destino == 'publicado' && 'https://quimicaifbacampusvca.github.io/mapaderiscoslaboratorio/' || 'http://127.0.0.1:4173/' }}
      - name: Guardar relatórios, capturas, vídeos e traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-real-${{ github.run_id }}
          path: tests/qa-results/
          retention-days: 30
          if-no-files-found: warn
